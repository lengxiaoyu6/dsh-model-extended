# dsh-model-extended bundle patch: inserts the plugin into a profile's layer stack.
#
# Installed through the official CLI (`dsh plugin --profile <name> add dsh-model-extended`),
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-model-extended` to the bundle stack. Profile boot
# then merges this patch — a single `insert` of the plugin row.
- insert:
    - id: dsh-model-extended
      name: 'dsh-model-extended'
      config:
        enabled: true
        # Put the per-model fields into the Models editor on load. The editor
        # bundle is backed up once beside itself before the first patch.
        patchEditor: true
        # Settings namespaces whose declarations the OVERLAY reads. Only the
        # DeepSeek adapter needs it: its schema has no per-model reasoning or
        # modality field, so this plugin supplies them. llm-pi-ai is deliberately
        # absent — pi-ai declares `reasoningEfforts` and `input` itself and
        # resolves them natively, and the overlay would read that dict as "no
        # declaration" and overwrite the adapter's own answer.
        namespaces:
          - llm-deepseek
